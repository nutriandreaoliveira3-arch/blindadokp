<script>

document.getElementById('abas').innerHTML = ABAS.map(([id, n]) => `<button class="aba" role="tab" data-aba="${id}">${n}</button>`).join('');
function mostrar(id) {
  if (!ABAS.some(([a]) => a === id)) id = 'visao';
  document.querySelectorAll('.aba').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.aba === id)));
  document.getElementById('conteudo').replaceChildren(document.getElementById('t-' + id).content.cloneNode(true));
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
}
document.addEventListener('click', async (e) => {
  const a = e.target.closest('[data-aba]'); if (a) { mostrar(a.dataset.aba); window.scrollTo(0, 0); return; }
  const c = e.target.closest('[data-c]');
  if (c) { const t = document.getElementById(c.dataset.c).innerText;
    try { await navigator.clipboard.writeText(t); c.textContent = 'Copiado ✓'; } catch { const r = document.createRange(); r.selectNodeContents(document.getElementById(c.dataset.c)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); c.textContent = 'Texto selecionado: Cmd + C'; }
    setTimeout(() => (c.textContent = 'Copiar'), 2200); }
});
window.addEventListener('hashchange', () => mostrar(location.hash.slice(1)));
mostrar(location.hash.slice(1) || 'visao');
</script>
